name: preflight
# The repository preflight on every push and pull request, whatever hooks anyone switched on
# locally. Runs on the mechanics alone: memory and library are absent here, which preflight allows.
on: [push, pull_request]
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python shared/skills/repository-preflight/scripts/preflight.py
      - run: python -m unittest discover -s shared/skills/repository-preflight/tests
      # The raw-file-ingestion skill (TASK-2026-0004): its 47 tests, each format and each defect fixed.
      - run: python -m unittest discover -s shared/skills/raw-file-ingestion/tests
